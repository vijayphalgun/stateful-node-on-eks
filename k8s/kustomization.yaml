apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ethereum

resources:
  - namespace.yaml
  - storageclass.yaml
  - services.yaml
  - statefulset.yaml
  - servicemonitors.yaml
  - prometheusrules.yaml

# Client versions are pinned here so an upgrade is a one-line, reviewable change.
images:
  - name: ethereum/client-go
    newTag: v1.14.12
  - name: sigp/lighthouse
    newTag: v6.0.1

labels:
  - pairs:
      app.kubernetes.io/part-of: ethereum-node
