# gp3 with provisioned IOPS and throughput. Chain sync is dominated by small random
# reads and writes, so IOPS, not capacity, is usually what limits sync speed.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-chaindata
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "6000"
  throughput: "250"
  encrypted: "true"
  fsType: ext4
# Create the volume only once the pod is scheduled, in that node's AZ.
volumeBindingMode: WaitForFirstConsumer
# Chains grow; volumes can be expanded online by editing the PVC request.
allowVolumeExpansion: true
# Delete keeps the sandbox cheap. Use Retain in production so deleting a
# StatefulSet or PVC can never destroy a synced chain.
reclaimPolicy: Delete
